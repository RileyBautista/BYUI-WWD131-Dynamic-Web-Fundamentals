<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card.css">
    <script src="card.js" defer></script>
</head>
<body>
    <div class="card">
        <img class="image" src="snortleblat.webp" alt="Character Image">
        <h2 class="name">Snortleblat</h2>
        <div class="stats">
            <p><b>Class: </b> Swamp Power Diplomat</p>
            <p id="level"></p>
            <p id="health"></p>

            <button class="attack-button" id="changeHealth">
                Attack
            </button>
            <button class="attack-button" id="changeLevel">
                Level Up
            </button>

        </div>
    </div>
</body>
</html>
